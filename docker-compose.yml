services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: neuro
      MARIADB_USER: neuro
      MARIADB_PASSWORD: neuro
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      DATABASE_URL: "mysql://neuro:neuro@db:3306/neuro?serverVersion=mariadb-11.0.0&charset=utf8mb4"
      REDIS_URL: "redis://redis:6379"
      APP_ENV: dev
      APP_SECRET: change_me_in_production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      NUXT_PUBLIC_API_BASE: "http://localhost:8000"
      NUXT_API_BASE: "http://nginx"
      CHOKIDAR_USEPOLLING: "true"

volumes:
  db_data:
  redis_data:
